<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Viewer - Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .aspect-video { aspect-ratio: 16 / 9; }
    </style>
</head>
<body class="bg-[#f5f5f5] min-h-screen flex flex-col items-center justify-center p-4">
    <div id="app-container" class="w-full max-w-4xl bg-white rounded-3xl shadow-sm border border-black/5 overflow-hidden opacity-0 transform translate-y-4 transition-all duration-700">
        <div class="p-8 border-b border-black/5 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center">
                <svg class="w-5 h-5 text-red-600 fill-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <div>
                <h2 class="text-2xl font-semibold tracking-tight text-zinc-900">Featured Video</h2>
                <p class="text-sm text-zinc-500">Watching: d0WB9BfGkws</p>
            </div>
        </div>

        <div class="relative aspect-video w-full bg-black">
            <iframe 
                class="absolute inset-0 w-full h-full"
                src="https://www.youtube.com/embed/d0WB9BfGkws?si=WPAwJD0HnikDtClc" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen
            ></iframe>
        </div>

        <div class="p-6 bg-zinc-50/50 flex justify-between items-center">
            <div class="flex gap-2">
                <span class="px-3 py-1 bg-white border border-black/5 rounded-full text-xs font-medium text-zinc-600">YouTube</span>
                <span class="px-3 py-1 bg-white border border-black/5 rounded-full text-xs font-medium text-zinc-600">HD</span>
            </div>
            <p class="text-xs text-zinc-400 font-mono uppercase tracking-widest">Ref: d0WB9BfGkws</p>
        </div>
    </div>

    <footer class="mt-8 text-zinc-400 text-sm">
        &copy; 2026 Video Viewer • Minimal Design
    </footer>

    <script>
        window.onload = () => {
            const container = document.getElementById('app-container');
            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('opacity-100', 'translate-y-0');
        };
    </script>
</body>
</html>
